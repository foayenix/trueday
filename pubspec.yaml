name: trueday
description: Manual lock-screen accountability tracker MVP
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Routing
  go_router: ^14.2.0

  # Local Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Time & Locale
  intl: ^0.19.0
  timezone: ^0.9.2
  clock: ^1.1.1

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Widgets
  home_widget: ^0.5.0

  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # Utilities
  uuid: ^4.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # To add assets, uncomment and add to the list:
  # assets:
  #   - images/
  #   - icons/
